<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2FBF9" />
    <script>
      try {
        const theme = localStorage.getItem('guardian:theme:v1');
        const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        if (dark) document.querySelector('meta[name="theme-color"]').content = '#10201E';
      } catch (_) { document.documentElement.style.colorScheme = 'light'; }
    </script>
    <meta
      name="description"
      content="校园智护，小护陪您问政策、护权益、报故障、学安全。面向高校后勤劳动者与勤工助学学生的智能服务台。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin />
    <link href="https://fonts.loli.net/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://chinese-fonts-cdn.deno.dev/packages/hc/dist/HarmonyOS_Sans_SC/result.css"
      onerror="this.onerror = null; this.href = '/harmonyos-sans-sc.css';" />
    <title>校园智护 · 每一份劳动，都值得被守护</title>
  </head>
  <body>
    <div class="ambient-mesh" aria-hidden="true">
      <span class="ambient-emerald"></span>
      <span class="ambient-sky"></span>
      <span class="ambient-mint"></span>
      <span class="ambient-wash"></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
