<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#234a3c" />
    <script>
      try {
        const theme = localStorage.getItem('guardian:theme:v1');
        const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (_) { document.documentElement.style.colorScheme = 'light'; }
    </script>
    <meta
      name="description"
      content="校园智护，小护陪您问政策、护权益、报故障、学安全。面向高校后勤劳动者与勤工助学学生的智能服务台。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>校园智护 · 每一份劳动，都值得被守护</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
